[project]
name = "cagr-predictor"
version = "0.1.0"
description = "NASDAQ-100 CAGR / annual growth analysis and 1-year price prediction with scikit-learn and LightGBM"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165",
    "joblib>=1.6",
    "lightgbm>=4.7",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "openpyxl>=3.1",
    "pandas>=3.1",
    "scikit-learn>=1.9",
    "yfinance>=1.8",
]

[project.scripts]
cagr-train = "cagr_predictor.train:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "pytest>=9.2.0",
]
